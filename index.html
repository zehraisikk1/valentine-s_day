<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6f2;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 1; /* Kutuyu temel seviyede tutuyoruz */
            backdrop-filter: blur(5px);
            position: relative;
        }

        h1 { color: #d63384; margin-bottom: 40px; pointer-events: none; }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 80px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            position: relative;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: fixed;
            z-index: 9999; /* En yüksek değer: Her zaman en önde kalmasını sağlar */
            transition: left 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-screen { display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveClose()" ontouchstart="moveClose()">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <h1 style="font-size: 45px; color: #ff4d6d;">Yay! 🥰</h1>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const container = document.getElementById('quizContainer');
        const yesBtn = document.getElementById('yesBtn');
        let yesScale = 1;

        window.onload = () => {
            const rect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (rect.right + 20) + 'px';
            noBtn.style.top = rect.top + 'px';
        };

        function moveClose() {
            const rect = container.getBoundingClientRect();
            
            // Hareket alanını kutunun etrafıyla sınırlıyoruz
            const padding = 50;
            const minX = rect.left - padding;
            const maxX = rect.right + padding - noBtn.offsetWidth;
            const minY = rect.top - padding;
            const maxY = rect.bottom + padding - noBtn.offsetHeight;

            const x = Math.random() * (maxX - minX) + minX;
            const y = Math.random() * (maxY - minY) + minY;
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function celebrate() {
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
