<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6f2;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .heart {
            position: absolute;
            background: rgba(255, 100, 150, 0.2);
            transform: rotate(-45deg);
            animation: floatHeart 15s infinite ease-in-out;
            z-index: 0;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 100, 150, 0.2);
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { left: 50%; top: 0; }
        .heart:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 5%; }
        .heart:nth-child(2) { width: 60px; height: 60px; top: 25%; right: 10%; animation-delay: 2s; }
        .heart:nth-child(3) { width: 100px; height: 100px; bottom: 15%; left: 20%; animation-delay: 4s; }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) rotate(-45deg); opacity: 0.8; }
            50% { transform: translateY(-30px) rotate(-45deg); opacity: 0.4; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(5px);
            width: 90%;
            max-width: 450px;
        }

        h1 {
            color: #d63384;
            font-size: 26px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 150px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 2;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            z-index: 10;
        }

        .success-screen {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>

    <div class="container" id="quizContainer">
        <h1 id="questionText">Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveAndGrow()" ontouchstart="moveAndGrow()">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <h1 style="font-size: 40px; color: #ff4d6d;">Yay! See you then! 🥰</h1>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        let yesSize = 18;
        let yesPaddingX = 25;
        let yesPaddingY = 12;

        function moveAndGrow() {
            // 1. NO BUTONUNU HAREKET ETTİR
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // 2. YES BUTONUNU BÜYÜT
            yesSize += 5;
            yesPaddingX += 5;
            yesPaddingY += 3;
            
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = `${yesPaddingY}px ${yesPaddingX}px`;
        }

        function celebrate() {
            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.6 }
            });

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            noBtn.style.display = 'none';
            document.body.style.backgroundColor = '#ffc0cb';
        }
    </script>
</body>
</html>
