<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6f2;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 1;
            backdrop-filter: blur(5px);
        }

        h1 { color: #d63384; margin-bottom: 40px; pointer-events: none; }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 100px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 1;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: fixed;
            z-index: 999;
            /* Akıcı takip için transition süresini hafif artırdım */
            transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-screen { display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveAndGrow()" ontouchstart="moveAndGrow()">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <h1 style="font-size: 45px; color: #ff4d6d;">Yay! SEE YOU THEN!! ❤️</h1>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        let yesScale = 1;

        // Sayfa ilk açıldığında No butonunun başlangıç pozisyonu
        window.onload = () => {
            resetNoButton();
        };

        function resetNoButton() {
            const rect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (rect.right + 20) + 'px';
            noBtn.style.top = rect.top + 'px';
        }

        function moveAndGrow() {
            // EKRANIN MERKEZİNDE TUTMA MANTIĞI
            // Ekranın sadece orta %60'lık kısmında hareket etmesini sağlıyoruz
            const marginWidth = window.innerWidth * 0.2; // Kenarlardan %20 boşluk
            const marginHeight = window.innerHeight * 0.2;
            
            const availableWidth = window.innerWidth * 0.6;
            const availableHeight = window.innerHeight * 0.6;

            const x = Math.random() * (availableWidth - noBtn.offsetWidth) + marginWidth;
            const y = Math.random() * (availableHeight - noBtn.offsetHeight) + marginHeight;
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // YES BUTONUNU BÜYÜT
            yesScale += 0.25; // Her kaçışta %25 büyür
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function celebrate() {
            confetti({ 
                particleCount: 200, 
                spread: 100, 
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#ffccd5', '#ffffff']
            });
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            noBtn.style.display = 'none';
            document.body.style.backgroundColor = '#ffc0cb';
        }
    </script>
</body>
</html>
