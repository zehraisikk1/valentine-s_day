<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #ffe6e6 0%, #ffb3c1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Arka plan süzülen kalpler */
        .heart-bg {
            position: fixed;
            top: -10%;
            color: rgba(255, 77, 109, 0.3);
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
            min-width: 350px;
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
            border: 2px solid white;
        }

        h1 {
            color: #d63384;
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: 800;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            min-height: 60px;
        }

        button {
            padding: 15px 40px;
            font-size: 22px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 25px rgba(255, 77, 109, 0.6);
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute;
            z-index: 10;
            transition: all 0.15s ease-out;
            user-select: none;
        }

        /* Kutlama Ekranı Tasarımı */
        .success-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .success-screen.active {
            opacity: 1;
            pointer-events: auto;
            display: flex;
        }

        .success-message {
            font-size: 50px;
            color: #ff4d6d;
            font-weight: 900;
            text-align: center;
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .big-heart {
            font-size: 150px;
            margin: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 77, 109, 0.5));
        }

        .date-text {
            font-size: 24px;
            color: #d63384;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onmousedown="moveButton()" onclick="return false;">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <div class="big-heart">💖</div>
        <div class="success-message">YAY! I KNEW IT! 🥰</div>
        <div class="date-text">See you on February 14th! 🌹</div>
    </div>

    <script>
        // Arka plan kalp animasyonu
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = ['❤️', '💖', '💗', '💕'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.2;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 300);

        const noBtn = document.getElementById('noBtn');
        const container = document.getElementById('quizContainer');

        function moveButton() {
            noBtn.style.pointerEvents = 'none';
            const rect = container.getBoundingClientRect();
            const padding = 20;
            
            const maxX = rect.width - noBtn.offsetWidth - padding;
            const maxY = rect.height - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            setTimeout(() => { noBtn.style.pointerEvents = 'auto'; }, 100);
        }

        function celebrate() {
            // Konfeti efektleri
            const duration = 15 * 1000;
            const animationEnd = Date.now() + duration;
            const heartShape = confetti.shapeFromText({ text: '❤️' });

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                confetti({
                    particleCount: 40,
                    spread: 80,
                    origin: { x: Math.random(), y: Math.random() - 0.2 },
                    colors: ['#ff4d6d', '#ff8fa3', '#ffffff', '#ff0000'],
                    shapes: [heartShape, 'circle']
                });
            }, 200);

            // Ekran geçişi
            container.style.display = 'none';
            const screen = document.getElementById('successScreen');
            screen.classList.add('active');
            
            // Ekstra büyük konfeti patlaması
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
