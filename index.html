<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6f2;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 1;
            backdrop-filter: blur(5px);
        }

        h1 { color: #d63384; margin-bottom: 40px; pointer-events: none; }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 100px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 1;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: fixed; /* Ekranda serbestçe dolaşması için */
            z-index: 999;
            transition: left 0.2s ease-out, top 0.2s ease-out;
        }

        .success-screen { display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveAndGrow()">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <h1 style="font-size: 45px; color: #ff4d6d;">Yay! 🥰</h1>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        let yesScale = 1;

        // Sayfa ilk açıldığında No butonunu kutunun yanına yerleştir
        window.onload = () => {
            const rect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (rect.right + 20) + 'px';
            noBtn.style.top = rect.top + 'px';
        };

        function moveAndGrow() {
            // 1. "NO" butonunu ekran sınırları içinde rastgele hareket ettir
            const padding = 50; // Kenarlara çok yapışmasın
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2) + padding;
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // 2. "YES" butonunu her kaçışta büyüt
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function celebrate() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
