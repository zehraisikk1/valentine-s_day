<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #ffe6e6 0%, #ffb3c1 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .heart-bg {
            position: fixed;
            top: -10%;
            color: rgba(255, 77, 109, 0.3);
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            position: relative;
            z-index: 5;
            width: 400px;
            min-height: 250px;
            backdrop-filter: blur(10px);
            border: 2px solid white;
        }

        h1 {
            color: #d63384;
            font-size: 32px;
            margin-bottom: 50px;
        }

        .buttons {
            position: relative;
            height: 100px; /* Butonların hareket alanı için yükseklik */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
            z-index: 20;
            margin-right: 120px; /* No butonu için boşluk */
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute;
            z-index: 10;
            left: 55%; /* Başlangıç pozisyonu */
            transition: all 0.15s ease-out;
            user-select: none;
            white-space: nowrap;
        }

        #successScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .success-message {
            font-size: 50px;
            color: #ff4d6d;
            font-weight: 900;
            text-align: center;
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .big-heart {
            font-size: 150px;
            filter: drop-shadow(0 0 20px rgba(255, 77, 109, 0.5));
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons" id="btnWrapper">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onmousedown="moveButton()">No</button>
        </div>
    </div>

    <div id="successScreen">
        <div class="big-heart">💖</div>
        <div class="success-message">YAY! I KNEW IT! 🥰</div>
        <p style="font-size: 24px; color: #d63384; font-weight: bold;">See you on February 14th! 🌹</p>
    </div>

    <script>
        // Arka plan kalpleri
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 300);

        const noBtn = document.getElementById('noBtn');
        const wrapper = document.getElementById('btnWrapper');

        function moveButton() {
            // Butonu "buttons" divi (wrapper) içinde hareket ettiriyoruz
            const rect = wrapper.getBoundingClientRect();
            
            // Butonun wrapper dışına çıkmaması için sınırlar
            const maxX = rect.width - noBtn.offsetWidth;
            const maxY = rect.height - noBtn.offsetHeight;

            // Rastgele yeni pozisyon (wrapper koordinatlarına göre)
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function celebrate() {
            document.getElementById('quizContainer').style.display = 'none';
            const screen = document.getElementById('successScreen');
            screen.style.display = 'flex';

            const duration = 10 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4d6d', '#ff758f']
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4d6d', '#ff758f']
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
