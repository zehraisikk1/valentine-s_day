<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none; /* Mobilde kaydırmayı engellemek için */
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #d63384;
            font-size: 28px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: fixed; /* Ekranın her yerine kaçabilmesi için */
            z-index: 999;
            transition: all 0.1s ease-out;
        }

        .success-screen {
            display: none;
            text-align: center;
        }

        .success-screen h1 {
            font-size: 40px;
            color: #ff4d6d;
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1 id="questionText">Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <h1>Yay! See you then! 🥰</h1>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        function moveButton() {
            // Butonun boyutlarını al
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Ekran sınırlarını al (kenarlardan biraz pay bırakarak)
            const maxX = window.innerWidth - btnWidth - 50;
            const maxY = window.innerHeight - btnHeight - 50;

            // Rastgele yeni koordinatlar
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Butonu yeni yerine ışınla
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function celebrate() {
            // Konfeti patlat
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // Ekranı temizle ve kutlama mesajını göster
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
