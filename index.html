<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Arka plan kalp yağmuru */
        .heart-bg {
            position: fixed;
            top: -10%;
            color: rgba(255, 77, 109, 0.2);
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
            min-width: 350px;
            min-height: 200px;
        }

        h1 {
            color: #d63384;
            font-size: 28px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            z-index: 3;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            transition: all 0.15s ease-out;
            z-index: 10;
            /* Dokunmatik ekranlarda basılı tutmayı engellemek için */
            user-select: none;
        }

        .success-screen {
            display: none;
            text-align: center;
            z-index: 5;
        }

        .success-screen h1 {
            font-size: 45px;
            color: #ff4d6d;
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1 id="questionText">Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onmousedown="moveButton()" onclick="return false;">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <h1>Yay! See you then! 🥰</h1>
        <div style="font-size: 100px; margin-top: 20px;">❤️</div>
    </div>

    <script>
        // Arka plan kalp döngüsü
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 300);

        const noBtn = document.getElementById('noBtn');
        const container = document.getElementById('quizContainer');

        function moveButton() {
            // Tıklamayı anlık olarak imkansız hale getir
            noBtn.style.pointerEvents = 'none';

            const rect = container.getBoundingClientRect();
            const padding = 20;
            
            // Butonun container sınırları içerisinde rastgele bir yere ışınlanması
            const maxX = rect.width - noBtn.offsetWidth - padding;
            const maxY = rect.height - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Hareket bittikten kısa süre sonra fare olaylarını geri aç (bir sonraki kaçış için)
            setTimeout(() => {
                noBtn.style.pointerEvents = 'auto';
            }, 100);
        }

        function celebrate() {
            const scalar = 2;
            const heartShape = confetti.shapeFromText({ text: '❤️', scalar });
            const duration = 10 * 1000;
            const animationEnd = Date.now() + duration;

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                confetti({
                    particleCount: 35,
                    spread: 70,
                    origin: { x: Math.random(), y: 0.5 },
                    colors: ['#ff4d6d', '#ff8fa3', '#ffffff'],
                    shapes: [heartShape]
                });
            }, 250);

            container.style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
