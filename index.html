<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Arka plan kalp animasyonu */
        .heart-bg {
            position: fixed;
            top: -10%;
            color: rgba(255, 77, 109, 0.2);
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #d63384;
            font-size: 28px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: fixed;
            z-index: 999;
            transition: all 0.1s ease-out;
        }

        .success-screen {
            display: none;
            text-align: center;
            z-index: 2;
        }

        .success-screen h1 {
            font-size: 45px;
            color: #ff4d6d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <h1 id="questionText">Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="successScreen" class="success-screen">
        <h1>Yay! See you then! ❤️❤️❤️</h1>
        <div style="font-size: 100px;">❤️</div>
    </div>

    <script>
        // Arka plana sürekli kalp ekleyen fonksiyon
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Her 300ms'de bir yeni kalp oluştur
        setInterval(createHeart, 300);

        const noBtn = document.getElementById('noBtn');

        function moveButton() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const maxX = window.innerWidth - btnWidth - 50;
            const maxY = window.innerHeight - btnHeight - 50;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function celebrate() {
            // Konfeti Ayarları (Kalp şeklinde konfeti fırlatır)
            const scalar = 2;
            const heartShape = confetti.shapeFromText({ text: '❤️', scalar });

            const duration = 10 * 1000;
            const animationEnd = Date.now() + duration;

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                // Hem normal renkli konfeti hem de kalp fırlat
                confetti({
                    particleCount: 40,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4d6d', '#ff8fa3', '#ffb3c1', '#ffffff'],
                    shapes: [heartShape, 'circle']
                });
                confetti({
                    particleCount: 40,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4d6d', '#ff8fa3', '#ffb3c1', '#ffffff'],
                    shapes: [heartShape, 'circle']
                });
            }, 250);

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
